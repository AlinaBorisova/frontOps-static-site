server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    location /.well-known/acme-challenge/ {
        root   /var/www/certbot;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name frontops-test.ru;

    ssl_certificate     /etc/letsencrypt/live/frontops-test.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontops-test.ru/privkey.pem;

    location / {
        root /static;
        index index.html;
    }
}